<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Chuẩn hóa 100% Font VT323 (Pixel) cho toàn bộ ứng dụng -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --pixel-scale: clamp(0.9rem, 2.2vh, 1.35rem);
    }

    body {
      font-family: "VT323", monospace;
      font-size: var(--pixel-scale);
      background-color: #bfdbfe;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 40px 40px;
      cursor: url("assets/cursor-small.png") 0 0, auto;
    }

    button, .clickable, a {
      cursor: url("assets/cursor-click.png") 0 0, pointer !important;
    }

    body.is-loading, .loading-state, button:active {
      cursor: url("assets/cursor-loading.png") 0 0, wait !important;
    }

    .font-pixel {
      font-family: "VT323", monospace;
    }

    @keyframes mascot-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px) rotate(-2deg); }
      75% { transform: translateX(6px) rotate(2deg); }
    }

    .shake {
      animation: mascot-shake 0.4s ease-in-out;
    }

    @keyframes ending-message-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ending-message-in {
      animation: ending-message-in 0.45s ease-out both;
    }

    #menu-toggle-btn {
      position: fixed;
      top: clamp(0.5rem, 1.8vh, 1.25rem);
      right: clamp(0.5rem, 1.8vh, 1.25rem);
      z-index: 50;
    }
  </style>
</head>
<body class="bg-sky-200 h-screen w-full overflow-hidden select-none">

  <!-- Nút Menu Cố Định Chung Cho Mọi Màn Hình -->
  <button
    id="menu-toggle-btn"
    type="button"
    aria-label="Open Settings"
    class="font-pixel aspect-square h-[6vh] max-h-12 min-h-[36px] bg-white text-black border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-slate-100 flex flex-col justify-center items-center gap-1 active:translate-y-[2px] active:shadow-none transition-all"
  >
    <span class="w-4 md:w-5 h-0.5 md:h-1 bg-black"></span>
    <span class="w-4 md:w-5 h-0.5 md:h-1 bg-black"></span>
    <span class="w-4 md:w-5 h-0.5 md:h-1 bg-black"></span>
  </button>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-[2px]">
    <div class="bg-white border-[5px] border-black shadow-[8px_8px_0_0_#000] w-[420px] max-w-[90vw] p-0 flex flex-col font-pixel">
      
      <div class="bg-pink-500 text-white px-4 py-2 flex justify-between items-center border-b-[4px] border-black">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 16 16">
            <path d="M6 0h4v2h2v2h2v4h2v4h-2v2h-2v2h-4v-2h-2v-2h-2v-4h-2v-4h2v-2h2v-2h2v-2zm1 3h-2v2h-2v2h-2v4h2v2h2v2h2v-2h2v-2h2v-4h-2v-2h-2v-2h-2v-2z"/>
          </svg>
          <span class="font-bold text-xl md:text-2xl tracking-wider">CÀI ĐẶT TRÒ CHƠI</span>
        </div>
        <button id="close-settings-btn" class="w-7 h-7 bg-red-500 text-white border-[3px] border-black shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none hover:bg-red-400 text-base font-bold flex items-center justify-center transition-all">✕</button>
      </div>

      <div class="p-4 md:p-5 flex flex-col gap-3 md:gap-4 bg-white">
        <div class="flex justify-between items-center bg-slate-100 border-[3px] border-black p-3 shadow-[3px_3px_0_0_#000]">
          <div class="flex items-center gap-3">
            <svg class="w-6 h-6 fill-current text-indigo-600 shrink-0" viewBox="0 0 16 16">
              <path d="M6 2h4v8.171a3.001 3.001 0 1 0 2 2.829v-8.171h-4v-5h-2v11.171a3.001 3.001 0 1 0 2 2.829v-8.999z"/>
            </svg>
            <span class="text-xl md:text-2xl font-bold tracking-wide">NHẠC NỀN (BGM)</span>
          </div>
          <button id="toggle-bgm" class="px-4 py-1 text-xl font-bold bg-emerald-400 text-black border-[3px] border-black shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none transition-all">ON</button>
        </div>

        <div class="flex justify-between items-center bg-slate-100 border-[3px] border-black p-3 shadow-[3px_3px_0_0_#000]">
          <div class="flex items-center gap-3">
            <svg class="w-6 h-6 fill-current text-indigo-600 shrink-0" viewBox="0 0 16 16">
              <path d="M2 5h3v6h-3v-6zm3-2h2v10h-2v-10zm2-2h2v14h-2v-14zm4 3h2v2h-2v-2zm0 6h2v2h-2v-2zm2-4h2v6h-2v-6z"/>
            </svg>
            <span class="text-xl md:text-2xl font-bold tracking-wide">HIỆU ỨNG (SFX)</span>
          </div>
          <button id="toggle-sfx" class="px-4 py-1 text-xl font-bold bg-emerald-400 text-black border-[3px] border-black shadow-[2px_2px_0_0_#000] active:translate-y-[2px] active:shadow-none transition-all">ON</button>
        </div>
      </div>
    </div>
  </div>

  <main class="w-full h-screen overflow-hidden flex flex-col">
    <!-- Home Screen -->
    <section id="home-screen" class="w-full h-full flex flex-col items-center justify-center gap-[3vh] p-[2vh]">
      <img src="assets/together.png" alt="Ginger Cat and Gray Cat together" class="w-full max-w-lg h-[50vh] object-contain drop-shadow-md" />
      <button id="home-start-btn" type="button" class="font-pixel px-[4vw] py-[1.8vh] text-[clamp(1.5rem,3.5vh,2.5rem)] font-bold bg-pink-500 text-white border-[4px] border-black shadow-[5px_5px_0_0_#000] hover:bg-pink-400 active:translate-y-[3px] active:shadow-none transition-all duration-100 tracking-wide">
        BẮT ĐẦU
      </button>
    </section>

    <!-- Intro Screen -->
    <section id="intro-screen" class="hidden w-full h-full flex flex-col items-center justify-center p-[2vh] relative box-border overflow-hidden">
      <div id="intro-step-content" class="flex-1 w-full flex items-center justify-center min-h-0"></div>
      <button id="intro-previous-btn" type="button" class="hidden font-pixel font-bold absolute bottom-[2vh] left-[2vh] text-[clamp(1rem,2.2vh,1.5rem)] px-[2vw] py-[1vh] bg-slate-400 text-black border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-slate-300 active:translate-y-[2px] active:shadow-none transition-all">
        🡨 Quay lại
      </button>
      <button id="intro-next-btn" type="button" class="font-pixel font-bold absolute bottom-[2vh] right-[2vh] text-[clamp(1rem,2.2vh,1.5rem)] px-[2.5vw] py-[1vh] bg-pink-500 text-white border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-pink-400 active:translate-y-[2px] active:shadow-none transition-all">
        Tiếp tục ➔
      </button>
    </section>

    <!-- QUIZ SCREEN -->
    <section id="quiz-card" class="hidden w-full h-full flex flex-col p-[1.5vh] gap-[1.2vh] box-border overflow-hidden min-h-0">
      
      <!-- HEADER: Racing Track đã scale to và tách rời icon -->
      <header class="shrink-0 w-full flex items-stretch gap-2 z-10 pr-16 md:pr-20">
        <div id="racing-track" class="flex-1 bg-white border-[3px] md:border-[5px] border-black shadow-[4px_4px_0_0_#000] px-4 py-2 flex flex-col justify-center">
          <!-- Icon Cột mốc: Đứng độc lập phía trên làn chạy -->
          <div class="flex justify-between items-end px-2 mb-1 relative z-20 pointer-events-none">
            <img src="assets/bakery.png" alt="Bakery milestone" class="h-[4.5vh] max-h-12 w-auto object-contain drop-shadow-sm" />
            <img src="assets/house.png" alt="Shared finish milestone" class="h-[4.5vh] max-h-12 w-auto object-contain drop-shadow-sm" />
          </div>
          <!-- Hai làn chạy: Tăng độ cao to rõ -->
          <div class="flex flex-col gap-2 relative z-10">
            <div class="relative h-[4.5vh] min-h-[30px] max-h-14 bg-sky-50 border-2 md:border-[3px] border-black">
              <div class="absolute inset-x-3 top-1/2 -translate-y-1/2 border-t-2 md:border-t-[3px] border-dashed border-slate-400"></div>
              <img id="graycat-racer" src="assets/graycat_running.png" alt="Gray Cat racer" class="absolute top-1/2 -translate-y-1/2 h-[5.5vh] max-h-16 w-auto object-contain transition-all duration-500 ease-out z-30 drop-shadow-md" style="left: 0%" />
            </div>
            <div class="relative h-[4.5vh] min-h-[30px] max-h-14 bg-pink-50 border-2 md:border-[3px] border-black">
              <div class="absolute inset-x-3 top-1/2 -translate-y-1/2 border-t-2 md:border-t-[3px] border-dashed border-slate-400"></div>
              <img id="gingercat-racer" src="assets/gingercat_walk.png" alt="Ginger Cat racer" class="absolute top-1/2 -translate-y-1/2 h-[5.5vh] max-h-16 w-auto object-contain transition-all duration-500 ease-out z-30 drop-shadow-md" style="left: 0%" />
            </div>
          </div>
        </div>
      </header>
      <!-- MAIN BODY (Chia cột tự động từ md, quản lý độ cao với min-h-0) -->
      <div class="flex-1 flex flex-col md:flex-row gap-[1.5vh] min-h-0 w-full">
        
        <!-- CỘT TRÁI: Quiz Core -->
        <div class="flex-1 md:flex-[3] bg-white border-[3px] md:border-[5px] border-black shadow-[4px_4px_0_0_#000] p-[1.8vh] flex flex-col min-h-0 gap-[1.2vh]">
          
          <div class="shrink-0 flex flex-col gap-[0.8vh]">
            <div class="flex items-center justify-between px-1">
              <div id="progress-indicator" class="font-pixel font-bold text-[clamp(1.2rem,2.8vh,2rem)] text-indigo-600 tracking-wide">
                Câu hỏi 1 / 10
              </div>
              <div id="score-indicator" class="font-pixel font-bold text-[clamp(1.2rem,2.8vh,2rem)] text-emerald-600 tracking-wide">
                Điểm: 0
              </div>
            </div>
            <div class="flex items-center gap-3 px-1">
              <span class="font-pixel font-bold text-[clamp(1.1rem,2.4vh,1.6rem)] text-slate-800 whitespace-nowrap">
                Thời gian
              </span>
              <div class="flex-1 h-[2vh] min-h-[12px] max-h-5 bg-slate-200 border-2 md:border-[3px] border-black overflow-hidden relative">
                <div id="timer-bar" class="h-full bg-indigo-500 transition-[width] duration-1000 ease-linear" style="width: 100%"></div>
              </div>
              <div id="timer-text" class="font-pixel text-[clamp(1.3rem,3vh,2.2rem)] font-bold text-slate-800 tabular-nums whitespace-nowrap">
                15s
              </div>
            </div>
          </div>

          <div class="shrink-0 flex items-center justify-start min-h-[5.5vh] px-1 py-1">
            <h1 id="question-text" class="font-pixel text-[clamp(1.35rem,3.4vh,2.5rem)] font-bold text-slate-900 text-left leading-snug">
              Loading question...
            </h1>
          </div>

          <!-- Container 4 nút đáp án co giãn động -->
          <div id="options-container" class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-[1.2vh] min-h-0"></div>
        </div>

        <!-- CỘT PHẢI: Mascot Mèo Xám & Khung Chat kéo sát nhau -->
        <aside id="mascot-status-panel" class="shrink-0 md:flex-[1.2] md:max-w-[400px] flex flex-row md:flex-col items-center justify-center bg-slate-800 border-[3px] md:border-[5px] border-black shadow-[4px_4px_0_0_#000] p-[1.8vh] min-h-0 gap-[1.5vh]">
          <!-- Bé Mèo: Căn sát xuống dưới gần khung chat -->
          <div class="shrink-0 flex items-end justify-center w-28 md:w-full min-h-0">
            <img id="mascot-image" src="assets/graycat.png" alt="Gray Cat status" class="h-auto max-h-[25vh] md:max-h-[36vh] w-auto object-contain drop-shadow-[4px_4px_0_rgba(0,0,0,0.6)]" />
          </div>
          <!-- Bubble Chat: Nằm sát ngay dưới bé Mèo -->
          <div class="flex-1 md:flex-none w-full flex items-start justify-center min-h-0">
            <div id="mascot-speech" class="w-full min-h-[9vh] max-h-[14vh] bg-white border-2 md:border-[4px] border-black shadow-[4px_4px_0_0_#000] p-[1.2vh] font-pixel font-bold text-[clamp(1.4rem,3.2vh,2.3rem)] text-slate-800 flex items-center justify-center text-center leading-snug overflow-y-auto">
              Sẵn sàng về nhà mừng sinh nhật Mèo Cam chưa?
            </div>
          </div>
        </aside>

      </div>
    </section>

    <!-- Results Screen -->
    <section id="completion-screen" class="hidden w-full h-full overflow-hidden flex flex-col p-[2vh] box-border justify-center">
      <div class="w-full max-w-3xl mx-auto flex flex-col items-center justify-center gap-[2vh] my-auto">
        
        <div id="result-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-[1.5vh] w-full font-pixel">
          <div class="bg-cyan-50 border-[3px] border-black shadow-[3px_3px_0_0_#000] p-[1.2vh] text-center">
            <div class="text-[clamp(1.8rem,4vh,3rem)] font-extrabold text-indigo-600" id="result-score">0</div>
            <div class="text-[clamp(1rem,2vh,1.3rem)] font-bold text-slate-700">Tổng điểm</div>
          </div>
          <div class="bg-lime-50 border-[3px] border-black shadow-[3px_3px_0_0_#000] p-[1.2vh] text-center">
            <div class="text-[clamp(1.8rem,4vh,3rem)] font-extrabold text-emerald-600" id="result-accuracy">0%</div>
            <div class="text-[clamp(1rem,2vh,1.3rem)] font-bold text-slate-700">Chính xác</div>
          </div>
          <div class="bg-amber-50 border-[3px] border-black shadow-[3px_3px_0_0_#000] p-[1.2vh] text-center">
            <div class="text-[clamp(1.8rem,4vh,3rem)] font-extrabold text-amber-600" id="result-time">0s</div>
            <div class="text-[clamp(1rem,2vh,1.3rem)] font-bold text-slate-700">Thời gian</div>
          </div>
        </div>

        <div id="ending-content" class="w-full flex items-center justify-center">
          <div class="ending-message-in flex flex-col items-center gap-[1vh] text-center">
            <img src="assets/together.png" alt="Ginger Cat and Gray Cat celebrating together" class="w-full max-w-md h-[30vh] object-contain drop-shadow-md" />
            <div class="font-pixel font-bold text-[clamp(1.8rem,4vh,3.2rem)] text-pink-600 drop-shadow-sm">Happy Birthday Mèo Cam!</div>
          </div>
        </div>

        <div id="ending-dialogue-container" class="hidden w-full overflow-hidden flex flex-col gap-[1vh]"></div>

        <div class="flex flex-wrap items-center justify-center gap-3 mt-1">
          <button id="ending-next-btn" type="button" class="hidden font-pixel font-bold px-[3vw] py-[1vh] text-[clamp(1.1rem,2.2vh,1.6rem)] bg-pink-500 text-white border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-pink-400 active:translate-y-[2px] active:shadow-none transition-all">
            Tiếp tục
          </button>
          <button id="play-again-btn" type="button" class="font-pixel font-bold px-[3vw] py-[1vh] text-[clamp(1.1rem,2.2vh,1.6rem)] bg-lime-400 text-black border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-lime-300 active:translate-y-[2px] active:shadow-none transition-all">
            Chơi Lại
          </button>
          <button id="home-btn" type="button" class="hidden font-pixel font-bold px-[3vw] py-[1vh] text-[clamp(1.1rem,2.2vh,1.6rem)] bg-sky-300 text-black border-[3px] border-black shadow-[3px_3px_0_0_#000] hover:bg-sky-200 active:translate-y-[2px] active:shadow-none transition-all">
            Trang Chủ
          </button>
        </div>

      </div>
    </section>
  </main>

  <script src="data/questions.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
