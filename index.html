<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: "VT323", monospace;
      font-size: 1.25rem;
      background-color: #bfdbfe;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 40px 40px;
      cursor: url("assets/cursor-small.png") 0 0, auto;
    }

    button,
    .clickable {
      cursor: url("assets/cursor-click.png") 0 0, pointer;
    }

    body.is-loading,
    .loading-state {
      cursor: url("assets/cursor-loading.png") 0 0, wait;
    }

    .font-pixel {
      font-family: "Press Start 2P", monospace;
    }

    @keyframes mascot-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px) rotate(-2deg); }
      75% { transform: translateX(6px) rotate(2deg); }
    }

    .shake {
      animation: mascot-shake 0.4s ease-in-out;
    }

    @keyframes ending-message-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ending-message-in {
      animation: ending-message-in 0.45s ease-out both;
    }

    #mute-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 50;
    }

    @media (max-width: 768px) {
      #intro-screen,
      #home-screen {
        padding: 1.25rem;
      }

      #intro-next-btn,
      #intro-previous-btn,
      #home-start-btn {
        font-size: 1.25rem;
        padding: 1rem 1.5rem;
      }

      #quiz-card {
        padding: 0.5rem;
        gap: 0.5rem;
      }

      #quiz-card .col-span-8,
      #quiz-card .col-span-4 {
        grid-column: span 12 / span 12;
      }

      #quiz-card .col-span-4 {
        max-height: 16rem;
      }

      #quiz-card #question-text {
        font-size: 1.75rem;
      }

      #quiz-card #options-container {
        gap: 0.5rem;
      }
    }

    @media (max-width: 480px) {
      #quiz-card #options-container {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
      }

      #quiz-card .font-pixel {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body class="bg-sky-200 h-screen w-full overflow-hidden">

  <button
    id="mute-toggle"
    type="button"
    aria-label="Mute sound"
    class="font-pixel px-3 py-2 text-xs bg-white text-black border-4 border-black shadow-[4px_4px_0_0_#000]"
  >
    Sound On
  </button>

  <main class="w-full h-screen overflow-hidden">
    <!-- Home Screen: the initial landing page. -->
    <section
      id="home-screen"
      class="w-full h-screen flex flex-col items-center justify-center gap-8 p-8"
    >
      <img
        src="assets/together.png"
        alt="Ginger Cat and Gray Cat together"
        class="w-full max-w-3xl max-h-[65vh] object-contain"
      />
      <button
        id="home-start-btn"
        type="button"
        class="font-pixel px-12 py-6 text-3xl bg-pink-500 text-white border-4 border-black shadow-[6px_6px_0_0_#000]
               hover:bg-pink-400 active:translate-x-[3px] active:translate-y-[3px]
               active:shadow-[3px_3px_0_0_#000] transition-all duration-100
               focus:outline-none focus:ring-2 focus:ring-pink-300"
      >
        Start
      </button>
    </section>

    <!-- Intro Screen: full-screen layout populated by js/app.js -->
    <section
      id="intro-screen"
      class="hidden w-full min-h-screen flex flex-col items-center justify-center p-8 relative"
    >
      <div id="intro-step-content" class="flex-1 w-full flex items-center">
        <!-- Populated by renderIntroStep() in js/app.js -->
      </div>

      <button
        id="intro-previous-btn"
        type="button"
        class="hidden font-pixel absolute bottom-12 left-12 text-3xl px-12 py-6
               bg-slate-400 text-black border-4 border-black shadow-[8px_8px_0_0_#000]
               hover:bg-slate-300 active:translate-x-[3px] active:translate-y-[3px]
               active:shadow-[3px_3px_0_0_#000] transition-all duration-100
               focus:outline-none focus:ring-2 focus:ring-slate-200"
      >
        🡨 Previous
      </button>

      <button
        id="intro-next-btn"
        type="button"
        class="font-pixel absolute bottom-12 right-12 text-3xl px-12 py-6
               bg-pink-500 text-white border-4 border-black shadow-[6px_6px_0_0_#000000]
               hover:bg-pink-400 active:translate-x-[3px] active:translate-y-[3px]
               active:shadow-[3px_3px_0_0_#000000] transition-all duration-100
               focus:outline-none focus:ring-2 focus:ring-pink-300"
      >
        Next ➔
      </button>
    </section>
    <!-- Quiz screen: racing map above a two-column question/status layout. -->
    <section id="quiz-card" class="hidden w-full h-screen overflow-hidden flex flex-col p-3 gap-3 box-border">
      <div class="w-full flex-1 min-h-0 flex flex-col gap-1">
        <div id="racing-track" class="shrink-0 py-1 px-2 mb-1 border-4 border-black bg-white shadow-[6px_6px_0_0_#000]">
          <div class="flex justify-between items-end px-1 mb-[-4px]">
            <img src="assets/bakery.png" alt="Bakery milestone" class="w-14 h-14 object-contain" />
            <img src="assets/house.png" alt="Shared finish milestone" class="w-14 h-14 object-contain" />
          </div>
          <div class="flex flex-col gap-1">
            <div class="flex items-center gap-3">
              <div class="relative flex-1 h-14 bg-sky-100 border-4 border-black">
                <div class="absolute inset-x-8 top-1/2 border-t-4 border-dashed border-slate-600"></div>
                <img
                  id="graycat-racer"
                  src="assets/graycat_running.png"
                  alt="Gray Cat racer"
                  class="absolute left-0 top-1/2 -translate-y-1/2 w-14 h-14 object-contain transition-all duration-500 ease-out"
                  style="left: 0%"
                />
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="relative flex-1 h-14 bg-pink-100 border-4 border-black">
                <div class="absolute inset-x-8 top-1/2 border-t-4 border-dashed border-slate-600"></div>
                <img
                  id="gingercat-racer"
                  src="assets/gingercat_walk.png"
                  class="absolute left-0 top-1/2 -translate-y-1/2 w-14 h-14 object-contain transition-all duration-500 ease-out"
                  style="left: 0%"
                />
              </div>
            </div>
          </div>
        </div>

        <div class="flex-1 grid grid-cols-12 gap-4 min-h-0 overflow-hidden">
          <div class="col-span-8 flex min-h-0 flex-col justify-between overflow-hidden p-6 bg-white border-4 border-black shadow-[6px_6px_0_0_#000]">
            <div class="flex items-center justify-between gap-4 mb-4">
              <div id="progress-indicator" class="font-pixel text-2xl text-indigo-500">
                Question 1 of 10
              </div>
              <div id="score-indicator" class="font-pixel text-2xl text-emerald-600">
                Score: 0
              </div>
            </div>

            <div class="flex items-center justify-between gap-4 mb-3">
              <span class="font-pixel text-xl text-slate-700">Time Left</span>
              <div id="timer-text" class="font-pixel text-3xl font-bold text-slate-700 tabular-nums">
                15s
              </div>
            </div>
            <div class="w-full h-3 bg-slate-200 border-2 border-black overflow-hidden mb-4">
              <div id="timer-bar" class="h-full bg-indigo-500 transition-[width] duration-1000 ease-linear" style="width: 100%"></div>
            </div>

            <h1 id="question-text" class="text-4xl font-bold text-slate-800 mb-4 leading-relaxed">
              Loading question...
            </h1>

            <div id="options-container" class="grid grid-cols-2 grid-rows-2 gap-4 flex-1 min-h-0">
              <!-- Answer buttons are injected here by js/app.js -->
            </div>
          </div>

          <aside
            id="mascot-status-panel"
            class="col-span-4 flex flex-col items-center justify-around p-6 bg-slate-800 border-4 border-black shadow-[6px_6px_0_0_#000]"
          >
            <div class="flex-1 flex items-center justify-center overflow-hidden">
              <img
                id="mascot-image"
                src="assets/graycat.png"
                alt="Gray Cat status"
                class="w-full max-w-[320px] h-auto object-contain"
              />
            </div>
            <div
              id="mascot-speech"
              class="w-[94%] max-w-full bg-white border-4 border-black shadow-[4px_4px_0_0_#000] p-8 text-3xl text-left leading-[42px] text-slate-800"
            >
              Ready to race home!
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- Results screen: hidden until the quiz finishes -->
    <section
      id="completion-screen"
      class="hidden w-full h-screen overflow-hidden flex flex-col p-6 sm:p-10 box-border"
    >
      <div class="w-full max-w-6xl mx-auto flex-1 flex flex-col items-center justify-center gap-4">
        <div id="result-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-3xl">
          <div class="bg-cyan-50 border-4 border-black shadow-[4px_4px_0_0_#000000] p-4 text-center">
            <div class="text-3xl font-extrabold text-indigo-600" id="result-score">0</div>
            <div class="text-sm text-slate-500 mt-1">Final Score</div>
          </div>
          <div class="bg-lime-50 border-4 border-black shadow-[4px_4px_0_0_#000000] p-4 text-center">
            <div class="text-3xl font-extrabold text-emerald-600" id="result-accuracy">0%</div>
            <div class="text-sm text-slate-500 mt-1">Accuracy</div>
          </div>
          <div class="bg-amber-50 border-4 border-black shadow-[4px_4px_0_0_#000000] p-4 text-center">
            <div class="text-3xl font-extrabold text-amber-600" id="result-time">0s</div>
            <div class="text-sm text-slate-500 mt-1">Time Taken</div>
          </div>
        </div>

        <div id="ending-content" class="w-full flex-1 flex items-center justify-center"></div>
        <div id="ending-dialogue-container" class="hidden w-full max-w-4xl overflow-hidden flex flex-col gap-2"></div>

        <div class="flex flex-wrap items-center justify-center gap-5">
          <button
            id="ending-next-btn"
            type="button"
            class="hidden font-pixel px-10 py-5 text-2xl bg-pink-500 text-white border-4 border-black shadow-[6px_6px_0_0_#000000]
                   hover:bg-pink-400 active:translate-x-[3px] active:translate-y-[3px]
                   active:shadow-[3px_3px_0_0_#000000] transition-all duration-100
                   focus:outline-none focus:ring-2 focus:ring-pink-300"
          >
            Next
          </button>
          <button
            id="play-again-btn"
            type="button"
            class="font-pixel px-8 py-4 text-xs bg-lime-400 text-black border-4 border-black shadow-[6px_6px_0_0_#000000]
                   hover:bg-lime-300 active:translate-x-[3px] active:translate-y-[3px]
                   active:shadow-[3px_3px_0_0_#000000] transition-all duration-100
                   focus:outline-none focus:ring-2 focus:ring-lime-200"
          >
            Play Again
          </button>
          <button
            id="home-btn"
            type="button"
            class="hidden font-pixel px-8 py-4 text-xs bg-sky-300 text-black border-4 border-black shadow-[6px_6px_0_0_#000000]
                   hover:bg-sky-200 active:translate-x-[3px] active:translate-y-[3px]
                   active:shadow-[3px_3px_0_0_#000000] transition-all duration-100
                   focus:outline-none focus:ring-2 focus:ring-sky-200"
          >
            Home
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="data/questions.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
